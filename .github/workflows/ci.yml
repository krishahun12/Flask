name: FlaskApp CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

      - name: Send email notification on test failure
        if: ${{ failure() && secrets.SMTP_SERVER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI Failure: ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.ALERT_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Unit tests failed in workflow "${{ github.workflow }}" for commit ${{ github.sha }}.
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t flaskapp:latest .

      - name: Save Docker image artifact
        run: docker save flaskapp:latest -o flaskapp.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v6
        with:
          name: flaskapp-image
          path: flaskapp.tar
          retention-days: 1

  push:
    name: Push Docker Image to Registries
    needs: [test, build]
    if: ${{ success() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: flaskapp-image

      - name: Load Docker image
        run: docker load -i flaskapp.tar

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'krisha2520' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        if: ${{ secrets.DOCKER_PASSWORD != '' }}
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME || 'krisha2520' }}"
          docker tag flaskapp:latest ${DOCKER_USER}/flaskapp:latest
          docker push ${DOCKER_USER}/flaskapp:latest

      - name: Warn if Docker Hub secret is missing
        if: ${{ secrets.DOCKER_PASSWORD == '' }}
        run: echo "::warning::DOCKER_PASSWORD secret is not set in Repository Secrets. Add a Read & Write Docker Hub token to push to Docker Hub."

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry (ghcr.io)
        run: |
          GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag flaskapp:latest ghcr.io/${GHCR_OWNER}/flaskapp:latest
          docker push ghcr.io/${GHCR_OWNER}/flaskapp:latest
